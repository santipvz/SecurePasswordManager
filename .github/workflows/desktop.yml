name: Desktop

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: false
      - run: npm ci
        working-directory: desktop
      - run: npm run check
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - name: Install Tauri build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb xauth
      - run: uv sync --locked --python "3.12" --no-install-project --extra yubikey --group build --group desktop-build
      - run: uv sync --locked --python "3.12" --no-build-isolation-package sec-pass-manager --extra yubikey --group build --group desktop-build
      - run: uv run --no-sync python desktop/scripts/bundle_vault.py
      - name: Test the desktop
        if: runner.os != 'Linux'
        run: cargo test --locked --features custom-protocol --manifest-path desktop/src-tauri/Cargo.toml
      - name: Test and build the optimized Linux desktop
        if: runner.os == 'Linux'
        run: |
          cargo test --release --locked --features custom-protocol --manifest-path desktop/src-tauri/Cargo.toml
          cargo build --release --locked --features custom-protocol --manifest-path desktop/src-tauri/Cargo.toml
      - name: Measure startup, search, and memory
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: |
          xvfb-run -a -e /dev/stderr uv run --no-sync python scripts/benchmark_desktop.py \
            desktop/src-tauri/target/release/secure-password-manager-desktop "$RUNNER_TEMP/desktop-performance.json"
      - name: Upload performance results
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-performance
          path: ${{ runner.temp }}/desktop-performance.json
          if-no-files-found: error
