name: Desktop prototype

on:
  push:
    branches: [develop]
    paths: [desktop/**, .github/workflows/desktop.yml]
  pull_request:
    paths: [desktop/**, .github/workflows/desktop.yml]

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Install Tauri build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
