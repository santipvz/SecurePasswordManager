name: Tests

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: false
      - run: uv sync --locked --python "${{ matrix.python-version }}" --no-install-project --extra yubikey --group build --group lint
      - run: uv sync --locked --python "${{ matrix.python-version }}" --no-build-isolation-package sec-pass-manager --extra yubikey --group build --group lint
      - run: uv run --no-sync python -m unittest discover -s tests -v
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: uv run --no-sync pylint src/spm
