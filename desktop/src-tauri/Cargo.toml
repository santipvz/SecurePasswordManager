[package]
name = "secure-password-manager-desktop"
version = "1.1.0"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = "2"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "sync", "time"] }
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.18"
rustix = { version = "1", features = ["time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "test-util"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[patch.crates-io]
# GTK 3 requires glib 0.18. This copy backports RUSTSEC-2024-0429.
glib = { path = "vendor/glib-0.18.5" }
