[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sec-pass-manager"
version = "2.0.0"
description = "Password generator and local encrypted vault"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "filelock>=4.2.10",
]

[project.optional-dependencies]
yubikey = ["fido2>=2.2.1,<3"]

[project.scripts]
cpass = "spm.console_interface:main"

[project.gui-scripts]
cpass-desktop = "spm.desktop_interface:main"

[tool.setuptools.packages.find]
where = ["src"]
